name: Validar painel e cardápio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Usar Chrome da imagem oficial do GitHub
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$BROWSER"
          "$BROWSER" --version
          echo "CHROMIUM_PATH=$BROWSER" >> "$GITHUB_ENV"
      - run: npm run test:browser
      - name: Guardar capturas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-painel-cardapio
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
